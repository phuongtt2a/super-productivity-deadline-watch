name: Check Deadline Watch

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check countdowns, syntax and ZIP
        run: |
          node tests/deadline-core.test.js
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install browser runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test mobile and desktop
        run: python tests/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadline-watch-preview
          path: |
            dist/deadline-watch-super-productivity.zip
            artifacts/*.png
          if-no-files-found: warn
