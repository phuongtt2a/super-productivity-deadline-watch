name: Feature request
description: Suggest a user-facing improvement
title: "enhancement: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
  - type: textarea
    id: success
    attributes:
      label: How should it work for users?
